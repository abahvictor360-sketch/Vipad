name: Build apps

# Builds installable Vipad apps for every platform.
# - Every push / PR: artifacts are attached to the workflow run.
# - Every push to the default branch (and any v* tag): the GitHub Release for the
#   version in package.json is created/updated with all installers, so the website's
#   download buttons (releases/latest/download/...) always work.
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux, flag: --linux }
          - { os: windows-latest, name: Windows, flag: --win }
          - { os: macos-latest, name: macOS, flag: --mac }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/e2e/desktop.electron.cjs release/linux-unpacked/vipad
      - uses: actions/upload-artifact@v4
        with:
          name: vipad-${{ matrix.name }}
          path: |
            release/Vipad-*.exe
            release/Vipad-*.dmg
            release/Vipad-*.AppImage
            release/Vipad-*.deb
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npx cap sync android
      - name: Decode signing key (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vipad.keystore" && echo "VIPAD_KEYSTORE=$RUNNER_TEMP/vipad.keystore" >> "$GITHUB_ENV"
      - name: Gradle assembleRelease
        working-directory: android
        env:
          VIPAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIPAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIPAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VIPAD_VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Vipad-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vipad-Android
          path: Vipad-android.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for simulator (CI check)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Vipad-ios-simulator.zip" App.app
      - name: Build unsigned device .ipa (for AltStore / Sideloadly, which re-sign it)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build-device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Vipad-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vipad-iOS
          path: |
            Vipad-ios-unsigned.ipa
            Vipad-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Never replace files of a published release: users would get 404s mid-upload.
          # Bump "version" in package.json to publish new installers.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $tag already published - skipping. Bump package.json version to release new installers."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Vipad ${{ steps.v.outputs.tag }}
          make_latest: 'true'
          generate_release_notes: true
          files: |
            out/Vipad-Setup-x64.exe
            out/Vipad-mac-universal.dmg
            out/Vipad-linux-x86_64.AppImage
            out/Vipad-linux-amd64.deb
            out/Vipad-android.apk
            out/Vipad-ios-unsigned.ipa
