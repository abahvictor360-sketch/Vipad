name: Build apps

# Builds installable Vipad apps for every platform.
# - Every push / PR: artifacts are attached to the workflow run.
# - Pushing a tag like v1.0.0: a GitHub Release is published with all installers
#   (the landing page download buttons point at the latest release).
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux, flag: --linux }
          - { os: windows-latest, name: Windows, flag: --win }
          - { os: macos-latest, name: macOS, flag: --mac }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/e2e/desktop.electron.cjs release/linux-unpacked/vipad
      - uses: actions/upload-artifact@v4
        with:
          name: vipad-${{ matrix.name }}
          path: |
            release/Vipad-*.exe
            release/Vipad-*.dmg
            release/Vipad-*.AppImage
            release/Vipad-*.deb
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npx cap sync android
      - name: Decode signing key (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vipad.keystore" && echo "VIPAD_KEYSTORE=$RUNNER_TEMP/vipad.keystore" >> "$GITHUB_ENV"
      - name: Gradle assembleRelease
        working-directory: android
        env:
          VIPAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIPAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIPAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VIPAD_VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Vipad-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vipad-Android
          path: Vipad-android.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npx cap sync ios
      - name: xcodebuild
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Vipad-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: vipad-iOS
          path: Vipad-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
